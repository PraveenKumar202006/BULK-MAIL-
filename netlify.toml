# Netlify Configuration File
# Tells Netlify to build the React frontend from the 'frontend' directory

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://backend-lemon-ten-34.vercel.app/api"

# Redirect rule to handle React Router / single page app paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
